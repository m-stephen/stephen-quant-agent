[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stephen-quant-agent"
version = "5.8.0"
description = "Integrity-first quantitative research infrastructure for the Stephen Quant Agent project."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Stephen"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
qmt-dat = ["rleveldb==1.0.0"]

[project.scripts]
stephen-quant = "stephen_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
