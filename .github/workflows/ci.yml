name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Standard CI or a separately reviewed once-only native diagnostic
        type: choice
        default: standard
        options:
          - standard
          - v122-runtime-diagnostic
          - v123-runtime-diagnostic

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'standard' }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'standard' }}
    name: test (Python ${{ matrix.python }}, trace ${{ matrix.trace }})
    # Fixed B18 runtime comparison after two native crashes. Keep the original
    # Python3.10/120s group required; do not retry until green or skip assertions.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            trace: 120
          - python: "3.10"
            trace: 0
          - python: "3.12"
            trace: 120
    # ubuntu-slim has a 15-minute runner hard limit; increasing the YAML timeout
    # did not fix B7 run 34086974315. This standard (not larger/paid) runner is
    # free for this public repository. Keep the full suite and bounded job time.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ubuntu-24.04
    # Leave time to upload diagnostics after the test step times out.
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      # Bound nested BLAS parallelism in CI only, not in empirical launch plans.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare native crash diagnostics
        run: |
          if ! command -v gdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y gdb
          fi
          gdb --version

      - name: Run tests
        timeout-minutes: 45
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          # B18 run 34118784744 exited with SIGSEGV, not an assertion failure.
          # Preserve native stacks without disk-heavy process-memory dumps.
          ulimit -c 0
          python -c "import sys, numpy, duckdb; print(sys.version); print('numpy', numpy.__version__, 'duckdb', duckdb.__version__); numpy.show_config()" 2>&1 | tee artifacts/ci/runtime.log
          /usr/bin/time -v -o artifacts/ci/resources.log gdb --batch --nx --return-child-result \
            -ex 'set debuginfod enabled off' \
            -ex 'set print thread-events off' \
            -ex 'set print frame-arguments none' \
            -ex run -ex 'thread apply all bt 40' \
            --args python -m pytest -vv --durations=25 -o faulthandler_timeout=${{ matrix.trace }} \
            --junitxml=artifacts/ci/pytest.xml 2>&1 | tee artifacts/ci/pytest.log
          # A debugger must not turn a truncated suite into a green check.
          python scripts/check_ci_test_result.py artifacts/ci/pytest.xml

      - name: Run lint
        if: ${{ !cancelled() }}
        run: ruff check src tests

      - name: Preserve test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python }}-trace${{ matrix.trace }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 7

  account-runtime-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'v123-runtime-diagnostic' }}
    name: V12.3 allocator diagnostic (${{ matrix.python }}, trace ${{ matrix.trace }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10.21", "3.12.14"]
        trace: [0, 120]
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact observed dependencies and debugger
        shell: bash
        run: |
          mkdir -p artifacts/v123-native
          if [ "${{ matrix.python }}" = "3.10.21" ]; then
            extra="numpy==2.2.6 exceptiongroup==1.3.1 tomli==2.4.1 typing-extensions==4.16.0"
          else
            extra="numpy==2.5.3"
          fi
          python -m pip install -e ".[dev]" $extra duckdb==1.5.5 pytest==9.1.1 ruff==0.16.6 pytz==2026.3.post1 iniconfig==2.3.0 packaging==26.3 pluggy==1.6.0 pygments==2.21.0
          python -m pip freeze --all > artifacts/v123-native/dependencies.txt
          python -VV > artifacts/v123-native/python-vv.txt
          if ! command -v gdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y gdb
          fi
          gdb --version > artifacts/v123-native/gdb.txt
      - name: One original synthetic fixture with allocator diagnostics (no retry)
        timeout-minutes: 17
        run: |
          ulimit -c 0
          python scripts/diagnose_account_runtime.py --python ${{ matrix.python }} --trace ${{ matrix.trace }} --output artifacts/v123-native/cell
      - name: Preserve every outcome including incomplete evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v123-native-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python }}-trace${{ matrix.trace }}
          path: artifacts/v123-native/
          if-no-files-found: error
          retention-days: 30

  native-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'v122-runtime-diagnostic' }}
    name: V12.2 bounded Python 3.12.14 trace-zero diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - name: Install observed crash dependency versions
        run: |
          python -m pip install -e ".[dev]" numpy==2.5.3 duckdb==1.5.5 pytest==9.1.1 ruff==0.16.6 pytz==2026.3.post1 iniconfig==2.3.0 packaging==26.3 pluggy==1.6.0 pygments==2.21.0
          mkdir -p artifacts/native-diagnostic
          python -m pip freeze --all > artifacts/native-diagnostic/dependencies.txt
          python -VV > artifacts/native-diagnostic/python-vv.txt
          git rev-parse HEAD > artifacts/native-diagnostic/commit.txt
          if ! command -v gdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y gdb
          fi
          gdb --version > artifacts/native-diagnostic/gdb.txt
          gdb --batch --nx -ex 'info files' --args python > artifacts/native-diagnostic/build-info.txt 2>&1
      - name: Twelve fixed synthetic child probes (no retry)
        timeout-minutes: 5
        run: |
          ulimit -c 0
          python scripts/probe_native_runtime.py --output artifacts/native-diagnostic/probes
      - name: Full suite with scheduled dump disabled (all assertions retained)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        shell: bash
        run: |
          mkdir -p artifacts/native-diagnostic
          set -o pipefail
          ulimit -c 0
          /usr/bin/time -v -o artifacts/native-diagnostic/resources.log gdb --batch --nx --return-child-result \
            -ex 'set debuginfod enabled off' -ex 'set print thread-events off' \
            -ex 'set print frame-arguments none' -ex run -ex 'thread apply all bt 40' \
            --args python -m pytest -vv --durations=25 -o faulthandler_timeout=0 \
            --junitxml=artifacts/native-diagnostic/pytest.xml 2>&1 | tee artifacts/native-diagnostic/pytest.log
          python scripts/check_ci_test_result.py artifacts/native-diagnostic/pytest.xml
      - name: Lint diagnostic implementation and project
        if: ${{ !cancelled() }}
        run: ruff check src tests scripts/probe_native_runtime.py
      - name: Preserve every diagnostic outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v122-native-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-diagnostic/
          if-no-files-found: error
          retention-days: 30
